name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Developer Certificate of Origin: every commit in a pull request must carry a
  # Signed-off-by trailer (see CONTRIBUTING.md). Implemented inline rather than with a
  # third-party action, because a public repo should not hand a marketplace action a token
  # to enforce a rule this small.
  #
  # The job always runs on a pull request; the bot exemption lives on the step below, not
  # here. A job skipped by a job-level `if` reports a status of "skipped", and a ruleset
  # that lists `dco` as a required check may sit waiting on it forever rather than treat
  # it as satisfied. Running the job and skipping its only step reports success instead.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the base and head commits both have to be present to diff them.
          fetch-depth: 0

      # Dependabot does not sign its commits and cannot be configured to. Keyed on who
      # OPENED the pull request, not github.actor: the actor is whoever triggered this
      # particular run, so pushing a commit to a bot branch or asking it to rebase can
      # make that a human and would drop the bot's unsigned commits back under the check.
      - name: Check sign-off on every commit
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          # --no-merges: a merge commit is generated by the person merging, not authored,
          # so requiring a certification on it would be meaningless.
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi
          for sha in $commits; do
            subject=$(git log -1 --format='%s' "$sha")
            author_email=$(git log -1 --format='%ae' "$sha")
            signoffs=$(git log -1 --format='%B' "$sha" \
              | grep -i '^Signed-off-by: .\+ <.\+@.\+>' || true)
            if [ -z "$signoffs" ]; then
              echo "::error::${sha:0:8} (\"$subject\") has no Signed-off-by line."
              status=1
              continue
            fi
            # The sign-off should be the commit's own author certifying their work. A
            # mismatch is usually a GitHub noreply address or a work/personal email split,
            # which is a warning rather than a failure -- the certification still stands.
            if ! printf '%s' "$signoffs" | grep -qiF "<$author_email>"; then
              echo "::warning::${sha:0:8} is signed off, but not by its author" \
                   "($author_email). Check that this is intentional."
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Contributions are accepted under the Developer Certificate of Origin"
            echo "(https://developercertificate.org/). Sign your commits with 'git commit -s'."
            echo "To fix the most recent commit:      git commit --amend -s"
            echo "To fix several:                     git rebase --signoff $BASE_SHA"
            echo "Then force-push the branch."
          fi
          exit "$status"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Installed WITHOUT provider extras on purpose: this proves the package imports and
      # its non-network behaviour works with zero provider SDKs present, which is the
      # promise the optional-dependencies make.
      #
      # It also type-checks in that environment, which is stricter than it looks: a
      # `# type: ignore` needed WITH an SDK installed is reported as unused WITHOUT it.
      # Provider client construction uses cast() for exactly this reason -- see the note
      # in providers/anthropic.py.
      - name: Install (no provider extras)
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  test-with-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install with every provider extra
        run: uv sync --group dev --extra all
      - name: Lint
        run: uv run ruff check .
      # Type-checked here too: with the SDKs present, mypy sees their real types rather
      # than Any, so this job catches a different class of error than the one above.
      - name: Type check
        run: uv run mypy
      # No credentials in CI, so live calls stay excluded (see the pytest markers). This
      # job exists to catch an SDK whose API drifted away from what the providers expect.
      - name: Test
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
