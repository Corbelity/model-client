[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corbelity-model-client"
version = "0.1.0"
description = "Provider-agnostic, traced client for text, image and speech model APIs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Corbelity LLC" }]
keywords = [
    "llm", "anthropic", "openai", "openrouter", "gemini", "ollama", "huggingface",
    "multimodal", "inference", "tracing", "observability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# The core package has NO required runtime dependencies. Every provider SDK is an extra
# and is imported lazily (see client.load_sdk), so installing this package to talk to one
# provider never drags in the other three -- and a bad release of any one SDK cannot make
# `import corbelity.model_client` fail.
dependencies = []

[project.optional-dependencies]
# Floors are the versions this package is actually tested against. Deliberately no upper
# caps: this is a library, and a cap blocks downstream projects that need a newer SDK for
# reasons of their own -- a cost paid by someone else, to guard against a break that may
# never come.
#
# The floors matter more than they look. They were previously well below what anyone runs
# (openai>=1.50 against an installed 3.x, huggingface-hub>=0.26 against 1.x), which is not
# a conservative floor but a false claim: a resolver picking the minimum would install a
# version nothing here has been run against.
#
# What an uncapped range costs is a break arriving at call time rather than install time.
# The Anthropic Messages API withdrew temperature, top_p and top_k, and passing one became
# a TypeError from the SDK before anything reached the service. Nothing in CI sees that
# until it runs against the new SDK, so the way this stays caught is testing against
# current releases -- not a version range. If one breaks, raise the floor past it.
anthropic = ["anthropic>=1.7"]
# OpenRouter, OpenAI and Gemini all speak chat completions through the same SDK. They get
# separate extras anyway, so `pip install corbelity-model-client[gemini]` works and the
# install hint on a missing dependency names the extra the caller actually asked for.
openrouter = ["openai>=3.16"]
openai = ["openai>=3.16"]
gemini = ["openai>=3.16"]
ollama = ["ollama>=0.6"]
# Pillow is not optional for HuggingFace: text_to_image returns a PIL.Image that the
# provider re-encodes to PNG bytes so callers never need Pillow themselves.
huggingface = ["huggingface-hub>=1.32", "pillow>=10.0"]
all = [
    "corbelity-model-client[anthropic]",
    "corbelity-model-client[openrouter]",
    "corbelity-model-client[openai]",
    "corbelity-model-client[gemini]",
    "corbelity-model-client[ollama]",
    "corbelity-model-client[huggingface]",
]

[project.urls]
Homepage = "https://github.com/Corbelity/model-client"
Source = "https://github.com/Corbelity/model-client"
Issues = "https://github.com/Corbelity/model-client/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
# `corbelity` is an implicit namespace package (PEP 420) with no __init__.py, so future
# siblings -- corbelity.trace, corbelity.agents -- install alongside this one without
# either package shadowing the other.
packages = ["src/corbelity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live provider calls cost money and need credentials: excluded by default, run with
#   pytest -m live
markers = ["live: hits a real provider endpoint (requires API keys)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["corbelity.model_client"]
strict = true
# The provider SDKs are optional installs, so mypy will not always find them.
ignore_missing_imports = true

